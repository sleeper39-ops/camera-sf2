<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF2 CCTV Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome ไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <!-- Header & Control Bar -->
    <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-sky-400 flex items-center gap-3">
                <i class="fa-solid fa-video text-sky-400"></i>
                SF2 CCTV Dashboard
            </h1>
            <p class="text-xs text-slate-400 mt-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> Sync with Firebase (camera-sf2)
            </p>
        </div>

        <button
            id="btnOpenAddModal"
            class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 transition font-medium shadow-lg shadow-sky-500/20">
            <i class="fa-solid fa-plus"></i>
            เพิ่มกล้องใหม่
        </button>
    </header>

    <!-- Camera Grid Display -->
    <main class="max-w-7xl mx-auto">
        <div id="cameraGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- รายการกล้องจะถูกดึงมาจาก Firebase แบบ Realtime -->
        </div>
    </main>

    <!-- Modal Form สำหรับเพิ่ม / แก้ไขกล้อง -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-5 border-b border-slate-700 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-camera text-sky-400"></i>
                    เพิ่มกล้องวงจรปิด
                </h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="cameraForm" class="space-y-4">
                <input type="hidden" id="camId">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">
                        ชื่อกล้อง / ตำแหน่ง
                    </label>
                    <input
                        type="text"
                        id="camName"
                        placeholder="เช่น กล้อง Tapo หลัก"
                        required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">
                        go2rtc Stream URL
                    </label>
                    <input
                        type="text"
                        id="camUrl"
                        placeholder="http://10.242.51.148:1984/api/stream.mp4?src=tapo_cam1&mp4=all"
                        required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 font-mono text-xs">
                    <p class="text-[10px] text-slate-400 mt-1">
                        * ตัวอย่าง MP4: http://10.242.51.148:1984/api/stream.mp4?src=tapo_cam1&mp4=all
                    </p>
                </div>

                <div class="pt-3 flex justify-end gap-3">
                    <button
                        type="button"
                        id="btnCancelModal"
                        class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white">
                        ยกเลิก
                    </button>
                    <button
                        id="saveButton"
                        type="submit"
                        class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                        บันทึกกล้อง
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            set, 
            update, 
            remove, 
            onValue, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0pvA-hcYCsV_dfJYlBtQ4XgdMrKP6lTU",
            authDomain: "camera-sf2.firebaseapp.com",
            databaseURL: "https://camera-sf2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "camera-sf2",
            storageBucket: "camera-sf2.firebasestorage.app",
            messagingSenderId: "165400713636",
            appId: "1:165400713636:web:47e3dfe15a60e870df8931",
            measurementId: "G-Q6GPMSJV6G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const camerasRef = ref(db, 'cameras');

        let cameraDataCache = {};

        function toggleModal(show) {
            const modal = document.getElementById("addModal");
            if (show) {
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        function openAddModal() {
            document.getElementById("cameraForm").reset();
            document.getElementById("camId").value = "";
            document.getElementById("modalTitle").innerHTML = `
                <i class="fa-solid fa-camera text-sky-400"></i> เพิ่มกล้องวงจรปิด
            `;
            document.getElementById("saveButton").innerText = "บันทึกกล้อง";
            toggleModal(true);
        }

        document.getElementById("btnOpenAddModal").addEventListener("click", openAddModal);
        document.getElementById("btnCloseModal").addEventListener("click", () => toggleModal(false));
        document.getElementById("btnCancelModal").addEventListener("click", () => toggleModal(false));

        const withTimeout = (promise, ms = 8000) => {
            let timeout = new Promise((_, reject) => 
                setTimeout(() => reject(new Error("การเชื่อมต่อหมดเวลา (Timeout)")), ms)
            );
            return Promise.race([promise, timeout]);
        };

        document.getElementById("cameraForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const saveBtn = document.getElementById("saveButton");
            const editId = document.getElementById("camId").value;
            const name = document.getElementById("camName").value.trim();
            const url = document.getElementById("camUrl").value.trim();

            if (!name || !url) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = "กำลังบันทึก...";

            try {
                if (editId) {
                    const itemRef = ref(db, `cameras/${editId}`);
                    await withTimeout(update(itemRef, {
                        name: name,
                        url: url,
                        updatedAt: serverTimestamp()
                    }));
                } else {
                    const newCamRef = push(camerasRef);
                    await withTimeout(set(newCamRef, {
                        name: name,
                        url: url,
                        createdAt: serverTimestamp()
                    }));
                }
                toggleModal(false);
            } catch (err) {
                console.error("Firebase Save Error:", err);
                alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = editId ? "บันทึกการแก้ไข" : "บันทึกกล้อง";
            }
        });

        window.editCamera = function(id) {
            const cam = cameraDataCache[id];
            if (!cam) return;

            document.getElementById("camId").value = id;
            document.getElementById("camName").value = cam.name || "";
            document.getElementById("camUrl").value = cam.url || "";

            document.getElementById("modalTitle").innerHTML = `
                <i class="fa-solid fa-pen-to-square text-sky-400"></i> แก้ไขข้อมูลกล้อง
            `;
            document.getElementById("saveButton").innerText = "บันทึกการแก้ไข";

            toggleModal(true);
        };

        window.deleteCamera = async function(id) {
            if (!confirm("คุณต้องการลบกล้องตัวนี้ใช่หรือไม่?")) {
                return;
            }
            try {
                const itemRef = ref(db, `cameras/${id}`);
                await withTimeout(remove(itemRef));
            } catch (err) {
                alert("ลบไม่สำเร็จ: " + err.message);
            }
        };

        onValue(camerasRef, (snapshot) => {
            const grid = document.getElementById("cameraGrid");
            grid.innerHTML = "";

            const data = snapshot.val();
            cameraDataCache = data || {};

            if (!data) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 border-2 border-dashed border-slate-800 rounded-xl text-slate-500">
                        <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
                        <p>ยังไม่มีรายการกล้องในระบบ</p>
                    </div>
                `;
                return;
            }

            Object.keys(data).forEach(id => {
                const cam = data[id];
                let targetUrl = cam.url;

                // ตรวจสอบว่าใส่โปรโตคอลมาหรือไม่ หากไม่มีให้ใส่ http:// ไว้ล่วงหน้า
                if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                    targetUrl = "http://" + targetUrl;
                }

                const card = document.createElement("div");
                card.className = "bg-slate-800 border border-slate-700/80 rounded-xl overflow-hidden shadow-xl flex flex-col";

                card.innerHTML = `
                    <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                        <div class="truncate pr-2">
                            <h2 class="font-semibold text-white text-sm truncate">
                                ${escapeHtml(cam.name)}
                            </h2>
                            <p class="text-xs text-slate-400 font-mono truncate" title="${escapeHtml(cam.url)}">
                                ${escapeHtml(cam.url)}
                            </p>
                        </div>

                        <div class="flex items-center gap-1 shrink-0">
                            <button
                                onclick="editCamera('${id}')"
                                class="text-slate-400 hover:text-amber-400 p-1.5 rounded transition"
                                title="แก้ไขกล้อง">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>

                            <button
                                onclick="deleteCamera('${id}')"
                                class="text-slate-400 hover:text-rose-400 p-1.5 rounded transition"
                                title="ลบกล้อง">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- เปลี่ยนจาก iframe มาใช้ video MP4 直接 -->
                    <div class="relative bg-black aspect-video flex items-center justify-center overflow-hidden">
                        <video 
                            src="${escapeAttribute(targetUrl)}" 
                            controls 
                            autoplay 
                            muted 
                            playsinline 
                            class="w-full h-full object-contain">
                        </video>
                    </div>
                `;

                grid.appendChild(card);
            });
        }, (error) => {
            console.error("Firebase Read Error:", error);
        });

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }
    </script>
</body>
</html>
