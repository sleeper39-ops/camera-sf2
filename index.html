<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTier CCTV Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome ไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <!-- Header & Control Bar -->
    <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-sky-400 flex items-center gap-3">
                <i class="fa-solid fa-video text-sky-400"></i>
                ZeroTier CCTV Dashboard
            </h1>
            <p class="text-xs text-slate-400 mt-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> Powered by go2rtc & Cloudflare
            </p>
        </div>

        <button
            onclick="openAddModal()"
            class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 transition font-medium shadow-lg shadow-sky-500/20">
            <i class="fa-solid fa-plus"></i>
            เพิ่มกล้องใหม่
        </button>
    </header>

    <!-- Camera Grid Display -->
    <main class="max-w-7xl mx-auto">
        <div id="cameraGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- รายการกล้องจะถูกโหลดจาก LocalStorage -->
        </div>
    </main>

    <!-- Modal Form สำหรับเพิ่ม / แก้ไขกล้อง -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-5 border-b border-slate-700 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-camera text-sky-400"></i>
                    เพิ่มกล้องวงจรปิด
                </h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="cameraForm" onsubmit="saveCamera(event)" class="space-y-4">
                <!-- ID -->
                <input type="hidden" id="camId">

                <!-- ชื่อกล้อง -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">
                        ชื่อกล้อง / ตำแหน่ง
                    </label>
                    <input
                        type="text"
                        id="camName"
                        placeholder="เช่น กล้องหน้าบ้าน (Tapo C200)"
                        required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>

                <!-- Stream URL -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">
                        go2rtc Stream URL
                    </label>
                    <input
                        type="text"
                        id="camUrl"
                        placeholder="https://cctv.yourdomain.com/stream.html?src=camera1"
                        required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 font-mono text-xs">
                    <p class="text-[10px] text-slate-400 mt-1">
                        * ใส่ URL หน้า Stream จาก go2rtc (เช่น WebRTC / MSE / MSE-H265 / stream.html)
                    </p>
                </div>

                <!-- Buttons -->
                <div class="pt-3 flex justify-end gap-3">
                    <button
                        type="button"
                        onclick="toggleModal(false)"
                        class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white">
                        ยกเลิก
                    </button>
                    <button
                        id="saveButton"
                        type="submit"
                        class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                        บันทึกกล้อง
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Key สำหรับเก็บข้อมูลใน LocalStorage
        const STORAGE_KEY = 'go2rtc_cameras_db';

        // โหลดข้อมูลกล้องจาก LocalStorage
        function getStoredCameras() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // บันทึกข้อมูลลง LocalStorage
        function saveStoredCameras(cameras) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cameras));
        }

        // Toggle Modal Display
        function toggleModal(show) {
            const modal = document.getElementById("addModal");
            if (show) {
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        // เปิด Modal เพิ่มกล้อง
        function openAddModal() {
            document.getElementById("cameraForm").reset();
            document.getElementById("camId").value = "";
            document.getElementById("modalTitle").innerHTML = `
                <i class="fa-solid fa-camera text-sky-400"></i> เพิ่มกล้องวงจรปิด
            `;
            document.getElementById("saveButton").innerText = "บันทึกกล้อง";
            toggleModal(true);
        }

        // เปิด Modal แก้ไขกล้อง
        function editCamera(id) {
            const cameras = getStoredCameras();
            const cam = cameras.find(c => c.id === id);
            if (!cam) return;

            document.getElementById("camId").value = cam.id;
            document.getElementById("camName").value = cam.name || "";
            document.getElementById("camUrl").value = cam.url || "";

            document.getElementById("modalTitle").innerHTML = `
                <i class="fa-solid fa-pen-to-square text-sky-400"></i> แก้ไขข้อมูลกล้อง
            `;
            document.getElementById("saveButton").innerText = "บันทึกการแก้ไข";

            toggleModal(true);
        }

        // เพิ่ม / แก้ไขข้อมูลกล้อง
        function saveCamera(e) {
            e.preventDefault();

            const editId = document.getElementById("camId").value;
            const name = document.getElementById("camName").value.trim();
            const url = document.getElementById("camUrl").value.trim();

            if (!name || !url) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            let cameras = getStoredCameras();

            if (editId) {
                // แก้ไขรายการเดิม
                cameras = cameras.map(cam => {
                    if (cam.id === editId) {
                        return { ...cam, name, url, updatedAt: new Date().toISOString() };
                    }
                    return cam;
                });
            } else {
                // เพิ่มรายการใหม่
                const newCamera = {
                    id: 'cam_' + Date.now(),
                    name,
                    url,
                    createdAt: new Date().toISOString()
                };
                cameras.push(newCamera);
            }

            saveStoredCameras(cameras);
            toggleModal(false);
            renderCameras();
        }

        // ลบกล้อง
        function deleteCamera(id) {
            if (!confirm("คุณต้องการลบกล้องตัวนี้ใช่หรือไม่?")) {
                return;
            }

            let cameras = getStoredCameras();
            cameras = cameras.filter(c => c.id !== id);
            saveStoredCameras(cameras);
            renderCameras();
        }

        // แสดงผลรายการกล้อง
        function renderCameras() {
            const grid = document.getElementById("cameraGrid");
            const cameras = getStoredCameras();

            grid.innerHTML = "";

            if (cameras.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 border-2 border-dashed border-slate-800 rounded-xl text-slate-500">
                        <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
                        <p>ยังไม่มีรายการกล้อง</p>
                        <p class="text-xs text-slate-600 mt-1">กดปุ่ม "เพิ่มกล้องใหม่" เพื่อเชื่อมต่อกับ go2rtc</p>
                    </div>
                `;
                return;
            }

            cameras.forEach(cam => {
                let targetUrl = cam.url;

                // จัดการเรื่อง Protocol อัตโนมัติรองรับ Cloudflare HTTPS
                if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                    targetUrl = (window.location.protocol === 'https:' ? 'https://' : 'http://') + targetUrl;
                }

                const card = document.createElement("div");
                card.className = "bg-slate-800 border border-slate-700/80 rounded-xl overflow-hidden shadow-xl flex flex-col";

                card.innerHTML = `
                    <!-- Camera Header -->
                    <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                        <div class="truncate pr-2">
                            <h2 class="font-semibold text-white text-sm truncate">
                                ${escapeHtml(cam.name)}
                            </h2>
                            <p class="text-xs text-slate-400 font-mono truncate" title="${escapeHtml(cam.url)}">
                                ${escapeHtml(cam.url)}
                            </p>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center gap-1 shrink-0">
                            <button
                                onclick="editCamera('${cam.id}')"
                                class="text-slate-400 hover:text-amber-400 p-1.5 rounded transition"
                                title="แก้ไขกล้อง">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>

                            <button
                                onclick="deleteCamera('${cam.id}')"
                                class="text-slate-400 hover:text-rose-400 p-1.5 rounded transition"
                                title="ลบกล้อง">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Camera Stream -->
                    <div class="relative bg-black aspect-video flex items-center justify-center">
                        <iframe
                            src="${escapeAttribute(targetUrl)}"
                            class="w-full h-full border-0"
                            allow="autoplay; fullscreen"
                            allowfullscreen>
                        </iframe>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ป้องกัน XSS
        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }

        // เริ่มทำงานเมื่อโหลดหน้าเว็บ
        document.addEventListener("DOMContentLoaded", renderCameras);
    </script>
</body>
</html>
